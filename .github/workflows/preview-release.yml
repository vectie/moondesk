name: Unsigned preview release

on:
  push:
    tags:
      - "v*.*.*-preview.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v
        required: true
        type: string
      release_notes:
        description: Repository-relative release-note Markdown path
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Checkout pinned MoonClaw integration revision
        uses: actions/checkout@v5
        with:
          repository: vectie/moonclaw
          ref: cd479814f7a8436390e4bb086ca173bc59ec9b37
          path: _integration/moonclaw
      - name: Checkout pinned MoonBook integration revision
        uses: actions/checkout@v5
        with:
          repository: vectie/moonbook
          ref: d75aaaa6a3f3c7aba71df68007436d54fc2ded59
          path: _integration/moonbook
      - name: Checkout pinned MoonTown integration revision
        uses: actions/checkout@v5
        with:
          repository: vectie/moontown
          ref: 99180427972d0d58b79175dedf158dbc464ecbeb
          path: _integration/moontown
      - name: Checkout pinned Lepusa preview host
        uses: actions/checkout@v5
        with:
          repository: vectie/lepusa
          ref: ca8cbeecd6fc8a12b252c176424fef2e05d66d60
          path: _integration/lepusa

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install repository validation tools
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/rabbita-desk/package-lock.json

      - name: Resolve immutable preview inputs
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_OR_VERSION: ${{ inputs.version || github.ref_name }}
          REQUESTED_NOTES: ${{ inputs.release_notes }}
        run: |
          scripts/resolve_preview_inputs.sh \
            --event "$EVENT_NAME" --tag-or-version "$TAG_OR_VERSION" \
            --notes "$REQUESTED_NOTES" --output-root "$RUNNER_TEMP" \
            >> "$GITHUB_OUTPUT"

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update

      - name: Normalize manifests for the installed MoonBit toolchain
        run: moon fmt

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui/rabbita-desk

      - name: Run mandatory validation
        run: scripts/validate.sh full
        env:
          MOONCLAW_ROOT: ${{ github.workspace }}/_integration/moonclaw
          MOONBOOK_ROOT: ${{ github.workspace }}/_integration/moonbook
          MOONTOWN_ROOT: ${{ github.workspace }}/_integration/moontown

      - name: Build unsigned preview
        run: |
          mkdir -p _build/preview-tmp
          sh scripts/preview_release.sh \
            --version "${{ steps.release.outputs.version }}" \
            --notes "${{ steps.release.outputs.notes }}" \
            --out "${{ steps.release.outputs.output }}" \
            --lepusa "${{ github.workspace }}/_integration/lepusa"
        env:
          TMPDIR: ${{ github.workspace }}/_build/preview-tmp

      - name: Reverify immutable artifact
        run: |
          node scripts/verify_release.mjs "${{ steps.release.outputs.output }}"

      - uses: actions/upload-artifact@v4
        with:
          name: moondesk-${{ steps.release.outputs.version }}-${{ github.sha }}-macos-arm64-unsigned
          path: ${{ steps.release.outputs.output }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false
