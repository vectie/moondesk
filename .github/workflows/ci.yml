name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Required repository validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Checkout MoonClaw integration revision
        uses: actions/checkout@v5
        with:
          repository: vectie/moonclaw
          ref: main
          path: _integration/moonclaw
      - name: Checkout MoonBook integration revision
        uses: actions/checkout@v5
        with:
          repository: vectie/moonbook
          ref: main
          path: _integration/moonbook
      - name: Checkout MoonTown integration revision
        uses: actions/checkout@v5
        with:
          repository: vectie/moontown
          ref: main
          path: _integration/moontown
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/rabbita-desk/package-lock.json
      - name: Verify pinned MoonBit dependencies
        run: |
          moon version --all
          moon update
          moon check --target all --warn-list +unnecessary_annotation
          git diff --exit-code -- moon.mod moon.pkg.json moon.lock
      - name: Install UI dependencies
        run: npm ci
        working-directory: ui/rabbita-desk
      - name: Phase 5 security suite
        run: |
          moon test --target native internal/fsx
          moon test --target native internal/preview
          moon test --target native internal/moonwiki/archive_security_wbtest.mbt
          moon test --target native internal/moonwiki/browser_security_wbtest.mbt
          moon test --target native core/desktop_authority_test.mbt
          moon test --target native internal/moonwiki/moonflow_action_receipt_wbtest.mbt
      - name: Validate
        run: scripts/validate.sh full
        env:
          MOONCLAW_ROOT: ${{ github.workspace }}/_integration/moonclaw
          MOONBOOK_ROOT: ${{ github.workspace }}/_integration/moonbook
          MOONTOWN_ROOT: ${{ github.workspace }}/_integration/moontown
