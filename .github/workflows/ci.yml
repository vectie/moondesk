name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Required repository validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/rabbita-desk/package-lock.json
      - name: Verify pinned MoonBit dependencies
        run: |
          moon version --all
          moon check --target all --warn-list +unnecessary_annotation
          git diff --exit-code -- moon.mod.json moon.pkg.json moon.lock
      - name: Install UI dependencies
        run: npm ci
        working-directory: ui/rabbita-desk
      - name: Validate
        run: scripts/validate.sh full
